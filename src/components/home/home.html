<!-- Hero Banner -->
<div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel"   data-bs-interval="3000"
     data-bs-pause="false">

  <!-- Indicators -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0"
      class="active"></button>

    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>

    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">

    <!-- Slide 1 -->
    <div class="carousel-item active" data-bs-interval="12000">
         
      <img src="assets/images/canva_001.png" 
           class="d-block w-100 banner-image"
           alt="Banner 1" >

      <div class="carousel-caption">

        <h1>Welcome to Novera Agro Farm</h1>

        <p>
          Healthy Cattle, Trusted Farm & Quality Service.
        </p>

        <a routerLink="/live_Stock" routerLinkActive="active" class="btn btn-success me-2">
          Explore Farm
        </a>

        <a routerLink="/contact" class="btn btn-light">
          Contact Us
        </a>

      </div>

    </div>

    <!-- Slide 2 -->
    <div class="carousel-item" data-bs-interval="10000">

      <img src="assets/images/canva_002.png"
           class="d-block w-100 banner-image"
           alt="Banner 2">

      <div class="carousel-caption slide23-caption">

        <h1>Premium Quality Cattle</h1>

        <p>
          We provide healthy and carefully raised cattle.
        </p>

      </div>

    </div>

    <!-- Slide 3 -->
    <div class="carousel-item" data-bs-interval="8000">

      <img src="assets/images/canva_003.png"
           class="d-block w-100 banner-image"
           alt="Banner 3">

      <div class="carousel-caption slide23-caption">

        <h1>Farm to Your Door</h1>

        <p>
          Safe delivery service across Bangladesh.
        </p>

      </div>

    </div>

  </div>

  <!-- Previous -->
  <button class="carousel-control-prev"
          type="button"
          data-bs-target="#heroCarousel"
          data-bs-slide="prev">

    <span class="carousel-control-prev-icon"></span>

  </button>

  <!-- Next -->
  <button class="carousel-control-next"
          type="button"
          data-bs-target="#heroCarousel"
          data-bs-slide="next">

    <span class="carousel-control-next-icon"></span>

  </button>

</div>
